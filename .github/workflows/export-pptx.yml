name: Export PPTX

on:
  workflow_call:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: |
          cd presentation
          bun install
          bun add -D playwright-chromium

      - name: Install Playwright system deps
        run: bunx playwright install-deps chromium

      - name: Export PPTX
        run: |
          cd presentation
          REPO_NAME="${{ github.event.repository.name }}"
          bunx slidev export --format pptx --output "${REPO_NAME}.pptx" --per-slide --with-clicks false --timeout 120000

      - name: Create/Update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          PPTX="presentation/${REPO_NAME}.pptx"
          TAG="latest"

          # Create or update the release
          gh release view "$TAG" > /dev/null 2>&1 && \
            gh release upload "$TAG" "$PPTX" --clobber || \
            gh release create "$TAG" "$PPTX" --title "${REPO_NAME}.pptx" --notes "Auto-generated PPTX export of the presentation slides."
